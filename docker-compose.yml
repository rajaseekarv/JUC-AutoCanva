services:
  postgres:
    image: postgres:16-alpine
    container_name: adflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adflow
      POSTGRES_PASSWORD: adflow
      POSTGRES_DB: adflow
    ports:
      - "5432:5432"
    volumes:
      - adflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adflow -d adflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: adflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - adflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adflow_postgres_data:
  adflow_redis_data:
